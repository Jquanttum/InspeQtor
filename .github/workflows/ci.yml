name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      - run: pip install pillow piexif numpy scikit-image
      - run: python3 tests/make_fixtures.py
      - run: node tests/parser_tests.js
      - run: node tests/compare_tests.js
      - run: node tests/fuzz_test.js
      - run: python3 tests/crosscheck.py
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium && node tests/e2e_test.js
